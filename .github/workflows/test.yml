name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Rust and connector smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      BENCH_US_DATABRICKS_HOSTNAME: ${{ secrets.BENCH_US_DATABRICKS_HOSTNAME }}
      DATABRICKS_ACCOUNT_ID: ${{ secrets.DATABRICKS_ACCOUNT_ID }}
      DATABRICKS_HOST: ${{ secrets.BENCH_US_DATABRICKS_HOSTNAME }}
      HARBORSQL_DATABRICKS_HOST: ${{ secrets.BENCH_US_DATABRICKS_HOSTNAME }}
      DATABRICKS_CLIENT_ID: ${{ secrets.TEST_CI_DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.TEST_CI_DATABRICKS_CLIENT_SECRET }}
      TEST_CI_DATABRICKS_CLIENT_ID: ${{ secrets.TEST_CI_DATABRICKS_CLIENT_ID }}
      TEST_CI_DATABRICKS_CLIENT_SECRET: ${{ secrets.TEST_CI_DATABRICKS_CLIENT_SECRET }}
      TEST_CI_DATABRICKS_PAT: ${{ secrets.TEST_CI_DATABRICKS_PAT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Databricks SQL connector
        run: python -m pip install --upgrade pip databricks-sql-connector databricks-sdk

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Rust tests
        run: cargo test --locked --all-targets

      - name: Run local connector smoke test
        run: cargo test --locked --test databricks_connector_smoke -- --ignored
        env:
          HARBORSQL_CONNECTOR_SMOKE_AUTH: local
          HARBORSQL_CONNECTOR_SMOKE_PYTHON: python

      - name: Run Databricks connector PAT smoke test
        if: env.TEST_CI_DATABRICKS_PAT != ''
        run: cargo test --locked --test databricks_connector_smoke -- --ignored
        env:
          HARBORSQL_CONNECTOR_SMOKE_AUTH: pat
          DATABRICKS_TOKEN: ${{ secrets.TEST_CI_DATABRICKS_PAT }}
          HARBORSQL_CONNECTOR_SMOKE_PYTHON: python

      - name: Run Databricks connector OAuth smoke test
        if: env.TEST_CI_DATABRICKS_CLIENT_ID != '' && env.TEST_CI_DATABRICKS_CLIENT_SECRET != '' && env.BENCH_US_DATABRICKS_HOSTNAME != ''
        run: cargo test --locked --test databricks_connector_smoke -- --ignored
        env:
          HARBORSQL_CONNECTOR_SMOKE_AUTH: oauth
          DATABRICKS_TOKEN: ""
          TEST_CI_DATABRICKS_PAT: ""
          HARBORSQL_CONNECTOR_SMOKE_PYTHON: python
