name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Rust and connector smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      BENCH_EU_DATABRICKS_HOSTNAME: ${{ secrets.BENCH_EU_DATABRICKS_HOSTNAME }}
      BENCH_US_DATABRICKS_HOSTNAME: ${{ secrets.BENCH_US_DATABRICKS_HOSTNAME }}
      DATABRICKS_ACCOUNT_ID: ${{ secrets.DATABRICKS_ACCOUNT_ID }}
      DATABRICKS_HOST: ${{ secrets.BENCH_EU_DATABRICKS_HOSTNAME }}
      HARBORSQL_DATABRICKS_HOST: ${{ secrets.BENCH_EU_DATABRICKS_HOSTNAME }}
      HARBORSQL_AWS_REGION: eu-west-3
      DATABRICKS_CLIENT_ID: ${{ secrets.TEST_CI_DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.TEST_CI_DATABRICKS_CLIENT_SECRET }}
      TEST_CI_DATABRICKS_CLIENT_ID: ${{ secrets.TEST_CI_DATABRICKS_CLIENT_ID }}
      TEST_CI_DATABRICKS_CLIENT_SECRET: ${{ secrets.TEST_CI_DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_CONNECTOR_SMOKE_ENABLED: ${{ vars.DATABRICKS_CONNECTOR_SMOKE_ENABLED }}
      TEST_CI_DATABRICKS_PAT: ${{ secrets.TEST_CI_DATABRICKS_PAT }}
      TEST_CI_DATABRICKS_PAT_HOSTNAME: ${{ secrets.TEST_CI_DATABRICKS_PAT_HOSTNAME }}

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install Databricks SQL connector
        run: python -m pip install --upgrade pip databricks-sql-connector databricks-sdk

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked --all-targets

      - name: Run local connector smoke test
        run: cargo test --locked --test databricks_connector_smoke python_databricks_sql_connector_can_execute_noop_statement -- --ignored
        env:
          HARBORSQL_CONNECTOR_SMOKE_AUTH: local
          HARBORSQL_CONNECTOR_SMOKE_PYTHON: python

      - name: Run Databricks connector PAT type matrix smoke test
        if: env.DATABRICKS_CONNECTOR_SMOKE_ENABLED == 'true' && env.TEST_CI_DATABRICKS_PAT != '' && env.TEST_CI_DATABRICKS_PAT_HOSTNAME != ''
        run: cargo test --locked --test databricks_connector_smoke python_databricks_sql_connector_can_execute_type_matrix_probe_query -- --ignored
        env:
          HARBORSQL_CONNECTOR_SMOKE_AUTH: pat
          HARBORSQL_CONNECTOR_SMOKE_REQUIRE_DATABRICKS: true
          DATABRICKS_HOST: ${{ secrets.TEST_CI_DATABRICKS_PAT_HOSTNAME }}
          HARBORSQL_DATABRICKS_HOST: ${{ secrets.TEST_CI_DATABRICKS_PAT_HOSTNAME }}
          DATABRICKS_TOKEN: ${{ secrets.TEST_CI_DATABRICKS_PAT }}
          HARBORSQL_CONNECTOR_SMOKE_PYTHON: python

      - name: Run Databricks connector OAuth type matrix smoke test
        if: env.DATABRICKS_CONNECTOR_SMOKE_ENABLED == 'true' && env.TEST_CI_DATABRICKS_CLIENT_ID != '' && env.TEST_CI_DATABRICKS_CLIENT_SECRET != '' && env.BENCH_EU_DATABRICKS_HOSTNAME != ''
        run: cargo test --locked --test databricks_connector_smoke python_databricks_sql_connector_can_execute_type_matrix_probe_query -- --ignored
        env:
          HARBORSQL_CONNECTOR_SMOKE_AUTH: oauth
          HARBORSQL_CONNECTOR_SMOKE_REQUIRE_DATABRICKS: true
          DATABRICKS_TOKEN: ""
          TEST_CI_DATABRICKS_PAT: ""
          HARBORSQL_CONNECTOR_SMOKE_PYTHON: python
