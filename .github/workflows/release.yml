name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: Run the pre-release benchmark command before building artifacts.
        required: true
        type: boolean
        default: true
      benchmark_command:
        description: Command to run when benchmarks are enabled.
        required: false
        type: string
        default: cargo test --release --locked --all-targets
      publish:
        description: Push packages when running manually.
        required: true
        type: boolean
        default: false
      package_tag:
        description: Tag to use when manually publishing. Defaults to sha-<commit>.
        required: false
        type: string
      build_macos:
        description: Build the macOS Apple Silicon artifact for manual pre-release runs. Stable GitHub releases always build it.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-24.04
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
      binaries_ref: ${{ steps.meta.outputs.binaries_ref }}
      package_tag: ${{ steps.meta.outputs.package_tag }}
      image_tags: ${{ steps.meta.outputs.image_tags }}
      publish: ${{ steps.meta.outputs.publish }}
      publish_latest: ${{ steps.meta.outputs.publish_latest }}
      build_macos: ${{ steps.meta.outputs.build_macos }}
      binary_matrix: ${{ steps.meta.outputs.binary_matrix }}
    steps:
      - name: Resolve package metadata
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BUILD_MACOS: ${{ inputs.build_macos }}
          INPUT_PACKAGE_TAG: ${{ inputs.package_tag }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          RELEASE_BODY_HAS_BUILD_MACOS: ${{ contains(github.event.release.body, '[build-macos]') }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail

          image_ref="ghcr.io/${GITHUB_REPOSITORY,,}"
          binaries_ref="${image_ref}-binaries"
          publish="false"
          publish_latest="false"
          build_macos="false"

          if [[ "${EVENT_NAME}" == "release" ]]; then
            package_tag="${GITHUB_REF_NAME}"
            publish="true"
            if [[ "${RELEASE_IS_PRERELEASE}" != "true" ]]; then
              publish_latest="true"
              build_macos="true"
            elif [[ "${RELEASE_BODY_HAS_BUILD_MACOS}" == "true" ]]; then
              build_macos="true"
            fi
          else
            package_tag="${INPUT_PACKAGE_TAG}"
            if [[ -z "${package_tag}" ]]; then
              package_tag="sha-${GITHUB_SHA::12}"
            fi
            if [[ "${INPUT_PUBLISH}" == "true" ]]; then
              publish="true"
            fi
            if [[ "${INPUT_BUILD_MACOS}" == "true" ]]; then
              build_macos="true"
            fi
          fi

          if [[ ! "${package_tag}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Package tag '${package_tag}' is not a valid Docker/OCI tag."
            exit 1
          fi

          binary_matrix='{"include":[{"label":"Linux x86_64","runner":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","artifact":"harborsql-linux-x86_64","binary":"harborsql","fast_linker":"true"}'
          if [[ "${build_macos}" == "true" ]]; then
            binary_matrix="${binary_matrix}"',{"label":"macOS Apple Silicon","runner":"macos-15","target":"aarch64-apple-darwin","artifact":"harborsql-macos-arm64","binary":"harborsql","fast_linker":"false"}'
          fi
          binary_matrix="${binary_matrix}"']}'

          {
            echo "image_ref=${image_ref}"
            echo "binaries_ref=${binaries_ref}"
            echo "package_tag=${package_tag}"
            echo "image_tags<<EOF"
            echo "${image_ref}:${package_tag}"
            if [[ "${publish_latest}" == "true" ]]; then
              echo "${image_ref}:latest"
            fi
            echo "EOF"
            echo "publish=${publish}"
            echo "publish_latest=${publish_latest}"
            echo "build_macos=${build_macos}"
            echo "binary_matrix=${binary_matrix}"
          } >> "${GITHUB_OUTPUT}"

  pre-release-checks:
    name: Pre-release benchmark gate
    runs-on: ubuntu-24.04
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.run_benchmarks)
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Compute Rust dependency cache key
        id: rust-cache-key
        shell: bash
        run: python3 .github/scripts/rust-cache-key.py >> "${GITHUB_OUTPUT}"

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: pre-release-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-cache-key.outputs.dependency_hash }}
          add-rust-environment-hash-key: "false"
          save-if: "false"

      - name: Discard cached HarborSQL artifacts
        run: cargo clean --release --package harborsql

      - name: Run benchmark command
        shell: bash
        env:
          BENCHMARK_COMMAND: ${{ inputs.benchmark_command || 'cargo test --release --locked --all-targets' }}
        run: |
          set -euo pipefail
          if [[ -z "${BENCHMARK_COMMAND}" ]]; then
            echo "::error::benchmark_command is required when run_benchmarks is enabled."
            exit 1
          fi
          bash -euxo pipefail -c "${BENCHMARK_COMMAND}"

  build-binaries:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    needs:
      - prepare
      - pre-release-checks
    if: always() && needs.prepare.result == 'success' && (needs.pre-release-checks.result == 'success' || needs.pre-release-checks.result == 'skipped')
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.binary_matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Compute Rust dependency cache key
        id: rust-cache-key
        shell: bash
        run: python3 .github/scripts/rust-cache-key.py >> "${GITHUB_OUTPUT}"

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: release-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ steps.rust-cache-key.outputs.dependency_hash }}
          add-rust-environment-hash-key: "false"
          save-if: "false"

      - name: Discard cached HarborSQL artifacts
        env:
          TARGET: ${{ matrix.target }}
        run: cargo clean --release --target "${TARGET}" --package harborsql

      - name: Install fast Linux linker
        if: matrix.fast_linker == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang mold

      - name: Build release binary
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.fast_linker == 'true' && 'clang' || '' }}
          RUSTFLAGS: ${{ matrix.fast_linker == 'true' && '-C link-arg=-fuse-ld=mold' || '' }}
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --bin harborsql --target "${TARGET}"

      - name: Package binary
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
          BINARY: ${{ matrix.binary }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          package_dir="dist/${ARTIFACT}"
          binary_path="target/${TARGET}/release/${BINARY}"

          mkdir -p "${package_dir}"
          cp "${binary_path}" "${package_dir}/harborsql"
          chmod 0755 "${package_dir}/harborsql"

          tar -C "${package_dir}" -czf "dist/${ARTIFACT}.tar.gz" harborsql
          shasum -a 256 "dist/${ARTIFACT}.tar.gz" > "dist/${ARTIFACT}.tar.gz.sha256"

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.tar.gz
            dist/${{ matrix.artifact }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  publish-image:
    name: Build and publish Docker image
    runs-on: ubuntu-24.04
    environment: release
    needs:
      - prepare
      - build-binaries
    if: always() && needs.prepare.result == 'success' && needs.build-binaries.result == 'success'
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Download Linux binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: harborsql-linux-x86_64
          path: dist/linux-x86_64

      - name: Prepare Docker context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/docker
          tar -xzf dist/linux-x86_64/harborsql-linux-x86_64.tar.gz -C dist/docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Prepare security metadata directory
        run: mkdir -p dist/security

      - name: Log in to GitHub Container Registry
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: dist/docker
          file: ./Dockerfile
          load: true
          platforms: linux/amd64
          push: false
          tags: ${{ needs.prepare.outputs.image_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.package_tag }}
            org.opencontainers.image.description=HarborSQL external SQL query engine

      - name: Scan image for fixable vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ needs.prepare.outputs.image_ref }}:${{ needs.prepare.outputs.package_tag }}
          fail-build: "true"
          severity-cutoff: high
          only-fixed: "true"
          output-format: sarif
          output-file: dist/security/harborsql-image-${{ needs.prepare.outputs.package_tag }}.grype.sarif

      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ needs.prepare.outputs.image_ref }}:${{ needs.prepare.outputs.package_tag }}
          format: spdx-json
          output-file: dist/security/harborsql-image-${{ needs.prepare.outputs.package_tag }}.sbom.spdx.json
          upload-artifact: "false"
          upload-release-assets: "false"

      - name: Push image
        if: needs.prepare.outputs.publish == 'true'
        id: push-image
        shell: bash
        env:
          IMAGE_REF: ${{ needs.prepare.outputs.image_ref }}
          IMAGE_TAGS: ${{ needs.prepare.outputs.image_tags }}
          PACKAGE_TAG: ${{ needs.prepare.outputs.package_tag }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            if [[ -n "${tag}" ]]; then
              docker push "${tag}"
            fi
          done <<< "${IMAGE_TAGS}"

          digest="$(docker buildx imagetools inspect "${IMAGE_REF}:${PACKAGE_TAG}" --format '{{.Manifest.Digest}}')"
          if [[ -z "${digest}" ]]; then
            echo "::error::Unable to resolve pushed image digest for ${IMAGE_REF}:${PACKAGE_TAG}."
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Install cosign
        if: needs.prepare.outputs.publish == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        if: needs.prepare.outputs.publish == 'true'
        shell: bash
        env:
          IMAGE_REF: ${{ needs.prepare.outputs.image_ref }}
          IMAGE_DIGEST: ${{ steps.push-image.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REF}@${IMAGE_DIGEST}"

      - name: Attach image SBOM with cosign
        if: needs.prepare.outputs.publish == 'true'
        shell: bash
        env:
          IMAGE_REF: ${{ needs.prepare.outputs.image_ref }}
          IMAGE_DIGEST: ${{ steps.push-image.outputs.digest }}
          PACKAGE_TAG: ${{ needs.prepare.outputs.package_tag }}
        run: |
          cosign attest \
            --yes \
            --predicate "dist/security/harborsql-image-${PACKAGE_TAG}.sbom.spdx.json" \
            --type spdxjson \
            "${IMAGE_REF}@${IMAGE_DIGEST}"

      - name: Attest image build provenance
        if: needs.prepare.outputs.publish == 'true' && (github.event.repository.private == false || vars.ENABLE_GITHUB_ATTESTATIONS == 'true')
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ needs.prepare.outputs.image_ref }}
          subject-digest: ${{ steps.push-image.outputs.digest }}
          push-to-registry: true

      - name: Attest image SBOM
        if: needs.prepare.outputs.publish == 'true' && (github.event.repository.private == false || vars.ENABLE_GITHUB_ATTESTATIONS == 'true')
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ needs.prepare.outputs.image_ref }}
          subject-digest: ${{ steps.push-image.outputs.digest }}
          sbom-path: dist/security/harborsql-image-${{ needs.prepare.outputs.package_tag }}.sbom.spdx.json
          push-to-registry: true

      - name: Upload image security metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-security-metadata
          path: dist/security/*
          if-no-files-found: error
          retention-days: 14

  publish-binaries:
    name: Publish native binary packages
    runs-on: ubuntu-24.04
    environment: release
    needs:
      - prepare
      - build-binaries
      - publish-image
    if: always() && needs.prepare.result == 'success' && needs.build-binaries.result == 'success' && needs.publish-image.result == 'success' && needs.prepare.outputs.publish == 'true'
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    timeout-minutes: 30
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: harborsql-*
          path: dist/artifacts
          merge-multiple: true

      - name: Generate binary SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist/artifacts
          format: spdx-json
          output-file: dist/artifacts/harborsql-binaries-${{ needs.prepare.outputs.package_tag }}.sbom.spdx.json
          upload-artifact: "false"
          upload-release-assets: "false"

      - name: Generate binary provenance subjects
        shell: bash
        env:
          BUILD_MACOS: ${{ needs.prepare.outputs.build_macos }}
          PACKAGE_TAG: ${{ needs.prepare.outputs.package_tag }}
        run: |
          set -euo pipefail
          subjects=(
            dist/artifacts/harborsql-linux-x86_64.tar.gz
            dist/artifacts/harborsql-linux-x86_64.tar.gz.sha256
            "dist/artifacts/harborsql-binaries-${PACKAGE_TAG}.sbom.spdx.json"
          )
          if [[ "${BUILD_MACOS}" == "true" ]]; then
            subjects+=(
              dist/artifacts/harborsql-macos-arm64.tar.gz
              dist/artifacts/harborsql-macos-arm64.tar.gz.sha256
            )
          fi
          sha256sum "${subjects[@]}" > "dist/artifacts/harborsql-binaries-${PACKAGE_TAG}.provenance.sha256"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign binary release artifacts
        shell: bash
        env:
          PACKAGE_TAG: ${{ needs.prepare.outputs.package_tag }}
        run: |
          set -euo pipefail
          artifacts=(
            dist/artifacts/harborsql-linux-x86_64.tar.gz
            "dist/artifacts/harborsql-binaries-${PACKAGE_TAG}.sbom.spdx.json"
            "dist/artifacts/harborsql-binaries-${PACKAGE_TAG}.provenance.sha256"
          )
          if [[ -f dist/artifacts/harborsql-macos-arm64.tar.gz ]]; then
            artifacts+=(dist/artifacts/harborsql-macos-arm64.tar.gz)
          fi
          for artifact in "${artifacts[@]}"; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "${artifact}"
          done

      - name: Attest binary build provenance
        if: github.event.repository.private == false || vars.ENABLE_GITHUB_ATTESTATIONS == 'true'
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-checksums: dist/artifacts/harborsql-binaries-${{ needs.prepare.outputs.package_tag }}.provenance.sha256

      - name: Attest binary SBOM
        if: github.event.repository.private == false || vars.ENABLE_GITHUB_ATTESTATIONS == 'true'
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-checksums: dist/artifacts/harborsql-binaries-${{ needs.prepare.outputs.package_tag }}.provenance.sha256
          sbom-path: dist/artifacts/harborsql-binaries-${{ needs.prepare.outputs.package_tag }}.sbom.spdx.json

      - name: Install ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1

      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GITHUB_TOKEN}" | oras login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Push binary archive package
        shell: bash
        env:
          BINARIES_REF: ${{ needs.prepare.outputs.binaries_ref }}
          BUILD_MACOS: ${{ needs.prepare.outputs.build_macos }}
          PACKAGE_TAG: ${{ needs.prepare.outputs.package_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          artifacts=(
            dist/artifacts/harborsql-linux-x86_64.tar.gz:application/gzip
            dist/artifacts/harborsql-linux-x86_64.tar.gz.sha256:text/plain
            dist/artifacts/harborsql-linux-x86_64.tar.gz.sigstore.json:application/vnd.dev.sigstore.bundle+json
            "dist/artifacts/harborsql-binaries-${PACKAGE_TAG}.sbom.spdx.json:application/spdx+json"
            "dist/artifacts/harborsql-binaries-${PACKAGE_TAG}.sbom.spdx.json.sigstore.json:application/vnd.dev.sigstore.bundle+json"
            "dist/artifacts/harborsql-binaries-${PACKAGE_TAG}.provenance.sha256:text/plain"
            "dist/artifacts/harborsql-binaries-${PACKAGE_TAG}.provenance.sha256.sigstore.json:application/vnd.dev.sigstore.bundle+json"
          )
          if [[ "${BUILD_MACOS}" == "true" ]]; then
            artifacts+=(
              dist/artifacts/harborsql-macos-arm64.tar.gz:application/gzip
              dist/artifacts/harborsql-macos-arm64.tar.gz.sha256:text/plain
              dist/artifacts/harborsql-macos-arm64.tar.gz.sigstore.json:application/vnd.dev.sigstore.bundle+json
            )
          fi

          oras push "${BINARIES_REF}:${PACKAGE_TAG}" \
            --artifact-type application/vnd.harborsql.binaries.v1+tar \
            --annotation "org.opencontainers.image.source=https://github.com/${REPOSITORY}" \
            --annotation "org.opencontainers.image.version=${PACKAGE_TAG}" \
            "${artifacts[@]}"

      - name: Push latest binary archive package
        if: needs.prepare.outputs.publish_latest == 'true'
        shell: bash
        env:
          BINARIES_REF: ${{ needs.prepare.outputs.binaries_ref }}
          PACKAGE_TAG: ${{ needs.prepare.outputs.package_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          artifacts=(
            dist/artifacts/harborsql-linux-x86_64.tar.gz:application/gzip
            dist/artifacts/harborsql-linux-x86_64.tar.gz.sha256:text/plain
            dist/artifacts/harborsql-linux-x86_64.tar.gz.sigstore.json:application/vnd.dev.sigstore.bundle+json
            dist/artifacts/harborsql-macos-arm64.tar.gz:application/gzip
            dist/artifacts/harborsql-macos-arm64.tar.gz.sha256:text/plain
            dist/artifacts/harborsql-macos-arm64.tar.gz.sigstore.json:application/vnd.dev.sigstore.bundle+json
            "dist/artifacts/harborsql-binaries-${PACKAGE_TAG}.sbom.spdx.json:application/spdx+json"
            "dist/artifacts/harborsql-binaries-${PACKAGE_TAG}.sbom.spdx.json.sigstore.json:application/vnd.dev.sigstore.bundle+json"
            "dist/artifacts/harborsql-binaries-${PACKAGE_TAG}.provenance.sha256:text/plain"
            "dist/artifacts/harborsql-binaries-${PACKAGE_TAG}.provenance.sha256.sigstore.json:application/vnd.dev.sigstore.bundle+json"
          )

          oras push "${BINARIES_REF}:latest" \
            --artifact-type application/vnd.harborsql.binaries.v1+tar \
            --annotation "org.opencontainers.image.source=https://github.com/${REPOSITORY}" \
            --annotation "org.opencontainers.image.version=${PACKAGE_TAG}" \
            "${artifacts[@]}"

      - name: Download image security metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-security-metadata
          path: dist/artifacts

      - name: Upload binaries to GitHub release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_TAG: ${{ needs.prepare.outputs.package_tag }}
          REPOSITORY: ${{ github.repository }}
        run: gh release upload "${PACKAGE_TAG}" dist/artifacts/* --repo "${REPOSITORY}"

  trigger-release-benchmarks:
    name: Trigger HarborSQL release benchmarks
    runs-on: ubuntu-24.04
    environment: release
    needs:
      - prepare
      - publish-image
      - publish-binaries
    if: always() && github.event_name == 'release' && github.event.release.prerelease == false && needs.prepare.result == 'success' && needs.prepare.outputs.publish == 'true' && needs.publish-image.result == 'success' && needs.publish-binaries.result == 'success'
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Dispatch harborsql-bench workflow
        shell: bash
        env:
          BENCHMARK_WORKFLOW_TOKEN: ${{ secrets.HARBORSQL_BENCH_WORKFLOW_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.package_tag }}
        run: |
          set -euo pipefail
          if [[ -z "${BENCHMARK_WORKFLOW_TOKEN:-}" ]]; then
            echo "::error::HARBORSQL_BENCH_WORKFLOW_TOKEN is required to dispatch harborsql-bench release benchmarks."
            exit 1
          fi

          response_file="$(mktemp)"
          http_status="$(
            curl -sS -L \
              -o "${response_file}" \
              -w "%{http_code}" \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${BENCHMARK_WORKFLOW_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/harborsql/harborsql-bench/actions/workflows/harborsql-release-benchmarks.yml/dispatches \
              -d "{\"ref\":\"main\",\"inputs\":{\"release_version\":\"${RELEASE_VERSION}\"}}"
          )"

          if [[ "${http_status}" != "204" ]]; then
            echo "::error::Failed to dispatch harborsql-bench release benchmarks; GitHub API returned HTTP ${http_status}."
            cat "${response_file}"
            exit 1
          fi

          echo "Dispatched harborsql-bench release benchmarks for ${RELEASE_VERSION}."
