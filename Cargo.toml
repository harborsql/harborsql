[package]
name = "harborsql"
version = "0.1.2-rc.1"
edition = "2024"
rust-version = "1.91"

[dependencies]
async-trait = "0.1"
arrow-json = "58.0.0"
axum = "0.8.9"
datafusion = "53.1.0"
deltalake = { version = "0.32.0", features = ["datafusion", "s3"] }
futures = "0.3"
hmac = "0.12"
object_store = "0.13.2"
regex = "1.12.2"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10"
sqlparser = "0.61.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal"] }
tower = "0.5"
tower-http = { version = "0.6.6", features = ["request-id", "trace", "util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
url = "2.5.7"
urlencoding = "2.1.3"
uuid = { version = "1.18.1", features = ["v4"] }
